# === MAZE preview alias on aiso.tools (single subdomain, path-routed) ========
# Sprint 14 (2026-06-15): preview before maze.bank DNS cutover. One subdomain
# only because CF Universal SSL on aiso.tools covers `*.aiso.tools` (single
# level) — `*.maze.aiso.tools` would need Advanced Certificate Manager or
# Total TLS, which we're deferring.
#
# Path map at this host:
#   /api/*                → strip `/api`, forward to neobank-api:8090
#                            (the web bundle that runs here MUST be built with
#                             VITE_NEXA_API_BASE=/api so the SPA calls
#                             /api/auth/start instead of api.maze.bank)
#   /mcp + /mcp/*         → forward as-is to neobank-api:8090 (MCP Streamable
#                            HTTP; flush_interval -1 keeps the stream open)
#   /metrics              → 404 (never exposed)
#   everything else       → neobank-web:80 (nginx routes /, /app.html,
#                            /portal.html, /checkout.html, /developers.html,
#                            and asset paths internally)
maze.aiso.tools:80 {
	import maze_security_headers
	import maze_sw_nocache

	@apiMetrics path /api/metrics /api/metrics/*
	handle @apiMetrics {
		respond "not found" 404
	}

	@api path /api/*
	handle @api {
		uri strip_prefix /api
		reverse_proxy neobank-api:8090 {
			header_up X-Real-Ip {remote_host}
			header_up X-Forwarded-Proto https
			flush_interval -1
			health_uri /healthz
			health_interval 15s
			health_timeout 3s
			health_status 2xx
		}
	}

	@mcp path /mcp /mcp/*
	handle @mcp {
		reverse_proxy neobank-api:8090 {
			header_up X-Real-Ip {remote_host}
			header_up X-Forwarded-Proto https
			flush_interval -1
			health_uri /healthz
			health_interval 15s
			health_timeout 3s
			health_status 2xx
		}
	}

	@metrics path /metrics
	handle @metrics {
		respond "not found" 404
	}

	handle {
		reverse_proxy neobank-web:80 {
			header_up X-Real-Ip {remote_host}
			header_up X-Forwarded-Proto https
			health_uri /healthz
			health_interval 15s
			health_timeout 3s
			health_status 2xx
		}
	}

	encode zstd gzip
	log {
		output stdout
		format json
		level INFO
	}
}

