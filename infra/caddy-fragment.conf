		health_uri /healthz
		health_interval 15s
		health_timeout 3s
		health_status 2xx
	}

	encode zstd gzip
	log {
		output stdout
		format json
		level INFO
	}
}

# === MAZE MCP facilitator (mcp.maze.bank → /mcp on neobank-api) ==============
