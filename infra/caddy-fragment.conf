# NEXA Caddy blocks — append to /opt/toolbox/infra/caddy/Caddyfile (and mirror
# in C:\dev\toolbox). Same conventions as the existing blocks: CF terminates
# TLS, tunnel forwards plaintext to caddy:80, health probes on the upstream,
# /metrics never exposed.
#
# Sprint 10 cutover: the maze.bank hosts below are the new canonical surfaces.
# The nexa.aiso.tools + maze.to hosts farther down stay live as ALIASES — each
# pair points at the SAME upstream container so a user hitting either domain
# reaches identical content. Once DNS bakes in for maze.bank, the aliases can
# be retired by deleting their blocks (no upstream changes required).
#
# Sprint 17 F082 — OWASP baseline security headers applied to every host via
# the (maze_security_headers) snippet. HSTS preload-eligible after Cloudflare
# strips X-Forwarded-Proto. Reference with `import maze_security_headers`
# inside each site block.
#
# Sprint 18 F084 — permissive CSP baseline. Closes clickjacking via frame-
# ancestors 'none' (X-Frame-Options DENY is the legacy belt; CSP is the
# braces), blocks <base> hijack via base-uri 'self', and forbids unsigned
# eval / new Function via not allowing 'unsafe-eval' anywhere. 'unsafe-inline'
# stays for now because the audit-closed pages still use inline scripts/styles
# — tightening to per-page hashes is a separate sprint. img-src widened to
# 'data:' + https: for the inline SVG emblem + remote payment-network logos;
# connect-src widened to the chain RPC + Privy + Sentry + PostHog endpoints
# the app calls from the browser. Verify the portal + checkout + admin pages
# render before tightening further.
(maze_security_headers) {
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "strict-origin-when-cross-origin"
		Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self)"
		# allow-popups (not bare same-origin): Privy's Google OAuth popup and the
		# Coinbase/Base wallet SDKs need window.opener back-channel to the popup.
		Cross-Origin-Opener-Policy "same-origin-allow-popups"
		Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://*.stripe.com https://*.privy.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.stripe.com; object-src 'none'; upgrade-insecure-requests"
		-Server
		-X-Powered-By
	}
}

# Force fresh service worker script delivery on PWA aliases.
(maze_sw_nocache) {
	header /sw.js {
		Cache-Control "no-cache, must-revalidate, max-age=0"
		Pragma "no-cache"
		Expires "0"
	}
}

# === MAZE app + landing (maze.bank apex + app subdomain) =====================
# maze.bank → neobank-web:80 (nginx static; / = landing, /app.html = app)
# app.maze.bank → neobank-web:80 with / rewritten to /app.html
maze.bank:80 {
	import maze_security_headers
	reverse_proxy neobank-web:80 {
		header_up X-Real-Ip {remote_host}
		header_up X-Forwarded-Proto https
		health_uri /healthz
		health_interval 15s
		health_timeout 3s
		health_status 2xx
	}

	encode zstd gzip
	log {
		output stdout
		format json
		level INFO
	}
}

app.maze.bank:80 {
	import maze_security_headers
	@root path /
	rewrite @root /app.html

	reverse_proxy neobank-web:80 {
		header_up X-Real-Ip {remote_host}
		header_up X-Forwarded-Proto https
		health_uri /healthz
		health_interval 15s
		health_timeout 3s
		health_status 2xx
	}

	encode zstd gzip
	log {
		output stdout
		format json
		level INFO
	}
}

