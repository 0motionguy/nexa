# MAZE — Alertmanager fanout config
#
# Attaches to the toolbox host's Alertmanager service (NOT run in MAZE's
# tenant compose-fragment.yml). The webhook URL is templated via the
# ALERTMANAGER_SLACK_WEBHOOK_URL env on the AlertManager service.
#
# Deploy: scripts/deploy-vps.sh syncs this file to
# /opt/toolbox/alertmanager/maze.yml on the VPS, then the operator restarts
# the alertmanager container.

global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: slack-critical
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: slack-default
    slack_configs:
      - api_url: '${ALERTMANAGER_SLACK_WEBHOOK_URL}'
        channel: '#maze-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  - name: slack-critical
    slack_configs:
      - api_url: '${ALERTMANAGER_SLACK_WEBHOOK_URL}'
        channel: '#maze-alerts-critical'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *CRITICAL* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          Runbook: https://github.com/0motionguy/nexa/blob/main/RUNBOOK.md
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'service']
