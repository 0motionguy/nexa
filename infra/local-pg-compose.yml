# Local Postgres + Redis for `pnpm dev` against a real DB.
#
# Usage:
#   docker compose -f infra/local-pg-compose.yml up -d
#   export DATABASE_URL=postgresql://toolbox:toolbox@localhost:5432/toolbox
#   export REDIS_URL=redis://:toolbox@localhost:6379
#   pnpm -F @nexa/api drizzle:migrate
#   pnpm dev
#
# When you don't want a DB, just skip this and `pnpm dev` runs InMemoryStore.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toolbox
      POSTGRES_PASSWORD: toolbox
      POSTGRES_DB: toolbox
    ports:
      - "5432:5432"
    volumes:
      - maze-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbox -d toolbox"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "toolbox"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "toolbox", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  maze-pg-data:
