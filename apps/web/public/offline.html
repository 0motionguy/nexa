<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MAZE · offline</title>
<meta name="theme-color" content="#F5F6FA" />
<style>
  :root { --bg:#F5F6FA; --fg:#090A0C; --muted:#4F535C; --meta:#8A8D96; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    display:grid; place-items:center; padding:24px;
    padding-top:max(24px, env(safe-area-inset-top));
    padding-bottom:max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap { text-align:center; max-width:300px; }
  .mark { width:54px; height:54px; margin:0 auto 22px; display:block; }
  h1 { font-size:17px; font-weight:600; letter-spacing:.04em; margin:0 0 10px; }
  p { font-family:'Inter', system-ui, sans-serif; font-size:13.5px; line-height:1.55; color:var(--muted); margin:0 0 22px; }
  button {
    font:inherit; font-size:13px; font-weight:600;
    background:var(--fg); color:var(--bg); border:0; border-radius:999px;
    min-height:46px; padding:0 22px; width:100%; cursor:pointer;
  }
  .meta { margin-top:20px; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--meta); }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="12" fill="#FF6A1A" />
      <g fill="#F5F6FA">
        <rect x="14" y="14" width="8" height="36" />
        <rect x="28" y="22" width="8" height="28" />
        <rect x="42" y="14" width="8" height="36" />
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>MAZE needs a connection to load your account. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="meta">MAZE</div>
  </div>
</body>
</html>
