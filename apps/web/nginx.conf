# NEXA web — static serve. TLS terminates at Cloudflare; Caddy fronts this
# container inside the toolbox compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # container liveness for compose healthcheck
    location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }

    # marketing surface at the root
    location = / {
        try_files /landing.html =404;
    }

    # immutable hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # html entries: no-cache so deploys are instant
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # generated one-time payment links should open the product app shell
    location = /pay {
        return 302 /pay/;
    }

    location /pay/ {
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }

    # email claim links open the app shell; auth auto-claims matching pending escrow
    location = /claim {
        return 302 /claim/;
    }

    location /claim/ {
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }

    # generated hosted offer checkout links open the standalone checkout page
    location = /o {
        return 302 /o/;
    }

    location /o/ {
        add_header Cache-Control "no-cache";
        try_files /checkout.html =404;
    }

    # public API reference at a clean URL (bare /developers.html still served by \.html$)
    location = /developers {
        add_header Cache-Control "no-cache";
        try_files /developers.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
